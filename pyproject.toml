[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "city-cloud-governance"
version = "0.1.0"
description = "Terraform-based multi-account AWS governance and cost-optimization reference, GovCloud style"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
citygov = "citygov.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
